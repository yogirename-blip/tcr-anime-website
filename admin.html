<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCR × YOGI Admin</title><style>
body{margin:0;background:#0b0f1a;color:#f4f7ff;font:15px Arial}.wrap{max-width:900px;margin:auto;padding:18px}.panel{background:#151c2b;border:1px solid #28364a;border-radius:14px;padding:16px;margin:14px 0}h1{color:#00ffd5}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin:5px 0 12px;background:#0d1421;color:white;border:1px solid #28364a;border-radius:8px}button{padding:11px 14px;border:0;border-radius:8px;background:#00ffd5;font-weight:bold}.muted{color:#9aa8bd}.hidden{display:none}.item{border:1px solid #28364a;border-radius:10px;padding:12px;margin:10px 0}.row{display:flex;gap:8px}.row>*{flex:1}
</style></head><body><div class="wrap"><h1>TCR × YOGI</h1><p class="muted">ADMIN CONTROL PANEL</p>
<section id="login" class="panel"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button onclick="doLogin()">Login</button><p id="loginMsg"></p></section>
<main id="app" class="hidden"><div class="panel"><button onclick="logout()">Logout</button><h2>Posts Manager</h2><input id="pid" type="hidden"><label>Title *</label><input id="title" placeholder="Anime / Movie title"><label>Category</label><select id="category"><option>Anime</option><option>Movies</option><option>Web Series</option><option>Cartoons</option></select><label>Description</label><textarea id="description"></textarea><label>Poster URL</label><input id="poster_url" placeholder="https://..."><div class="row"><input id="season" placeholder="Season"><input id="episode" placeholder="Episode"></div><div class="row"><input id="quality" placeholder="Quality 720p"><input id="audio" placeholder="Tamil Only / Multi Audio"></div><label>Telegram Chat ID</label><input id="telegram_chat_id"><label>Telegram Message ID</label><input id="telegram_message_id"><label>Watching Now URL</label><input id="watching_url" placeholder="https://..."><label>Shortener URL</label><input id="short_url" placeholder="https://..."><label>Status</label><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select><button onclick="savePost()">Save Post</button> <button onclick="clearForm()">Clear</button><p id="msg"></p></div>
<div class="panel"><h2>Saved Posts</h2><div id="posts"></div></div><div class="panel"><h2>Telegram Files</h2><button onclick="loadFiles()">Refresh Files</button><div id="files"></div></div><div class="panel"><h2>Admin Emails</h2><input id="newAdmin" type="email" placeholder="Add another admin email"><button onclick="addAdmin()">Add Email</button><div id="admins"></div></div><div class="panel"><h2>URL Manager</h2><input id="urlLabel" placeholder="Link label"><input id="urlValue" placeholder="https://..."><button onclick="addUrl()">Save URL</button><div id="urls"></div></div></main></div>
<script>
const $=id=>document.getElementById(id);let cache=[];
async function api(p,o={}){let r=await fetch('/api'+p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||r.status);return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function doLogin(){try{await api('/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');loadPosts();loadAdmins();loadUrls()}catch(e){$('loginMsg').textContent=e.message}}
async function logout(){await api('/logout',{method:'POST'});location.reload()}
function form(){let d={};['title','category','description','poster_url','season','episode','quality','audio','telegram_chat_id','telegram_message_id','watching_url','short_url','status'].forEach(k=>d[k]=$(k).value);return d}
function clearForm(){['pid','title','description','poster_url','season','episode','quality','audio','telegram_chat_id','telegram_message_id','watching_url','short_url'].forEach(k=>$(k).value='')}
async function savePost(){try{let id=$('pid').value;await api('/posts'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(form())});$('msg').textContent='Saved';clearForm();loadPosts()}catch(e){$('msg').textContent=e.message}}
async function loadPosts(){try{cache=await api('/posts');$('posts').innerHTML=cache.map(p=>`<div class=item><b>${esc(p.title)}</b><p>${esc(p.category)} · ${esc(p.status)}</p><button onclick="edit(${p.id})">Edit</button> <button onclick="del(${p.id})">Delete</button> <button onclick="copyWatch(${p.id})">Copy Watch URL</button></div>`).join('')||'No posts yet'}catch(e){$('posts').textContent=e.message}}
function edit(id){let p=cache.find(x=>x.id===id);$('pid').value=id;['title','category','description','poster_url','season','episode','quality','audio','telegram_chat_id','telegram_message_id','watching_url','short_url','status'].forEach(k=>$(k).value=p[k]||'');scrollTo(0,0)}
async function del(id){if(confirm('Delete post?')){await api('/posts/'+id,{method:'DELETE'});loadPosts()}}
async function copyWatch(id){let u=location.origin+'/watch/'+id;try{await navigator.clipboard.writeText(u);alert('Copied '+u)}catch{prompt('Copy URL',u)}}
async function loadFiles(){try{let a=await api('/telegram-files');$('files').innerHTML=a.map(f=>`<div class=item>${esc(f.title||f.filename)}<p>${esc(f.quality)} · ${esc(f.audio)}</p></div>`).join('')||'No files'}catch(e){$('files').textContent=e.message}}
async function loadAdmins(){try{let a=await api('/admins');$('admins').innerHTML=a.map(x=>`<div class=item>${esc(x.email)} ${x.is_super_admin?'(Primary admin)':`<button onclick='removeAdmin(${JSON.stringify(x.email)})'>Remove</button>`}</div>`).join('')}catch(e){$('admins').textContent=e.message}}
async function addAdmin(){try{await api('/admins',{method:'POST',body:JSON.stringify({email:$('newAdmin').value})});$('newAdmin').value='';loadAdmins()}catch(e){alert(e.message)}}
async function removeAdmin(email){if(confirm('Remove '+email+'?')){await api('/admins',{method:'DELETE',body:JSON.stringify({email})});loadAdmins()}}
async function loadUrls(){try{let a=await api('/urls');$('urls').innerHTML=a.map(x=>`<div class=item>${esc(x.label)}: <a href="${esc(x.url)}">${esc(x.url)}</a></div>`).join('')}catch(e){$('urls').textContent=e.message}}
async function addUrl(){try{await api('/urls',{method:'POST',body:JSON.stringify({label:$('urlLabel').value,url:$('urlValue').value})});loadUrls()}catch(e){alert(e.message)}}
api('/me').then(()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');loadPosts();loadAdmins();loadUrls()}).catch(()=>{});
</script></body></html>
